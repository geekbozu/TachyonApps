services:
  mount-check:
    image: alpine:latest
    container_name: tailscale-mount-check
    volumes:
      - /mnt/sdcard:/mnt/sdcard:ro
    command: >
      sh -c '
      echo "Waiting for SD card mount...";
      for i in 1 2 3 4 5; do
        if mountpoint -q /mnt/sdcard 2>/dev/null && [ -d /mnt/sdcard ] && [ "$$(ls -A /mnt/sdcard 2>/dev/null | wc -l)" -gt 0 ]; then
          echo "SD card mount verified.";
          exit 0;
        fi;
        echo "Mount not ready, waiting 5 seconds... (attempt $$i/5)";
        sleep 5;
      done;
      echo "ERROR: SD card mount not available after 25 seconds.";
      echo "Please ensure the sdcard-mount container is running.";
      exit 1;
      '
    restart: "no"

  tailscale:
    image: alpine:latest
    container_name: tailscale-host-config
    depends_on:
      mount-check:
        condition: service_completed_successfully
    network_mode: host
    pid: host
    privileged: true
    command: >
      sh -c '
      echo "=== Tailscale Host Config Service ===";
      KEY_FILE="/mnt/sdcard/tailscale/key/preauth.key.save";
      
      echo "Checking for auth key on host...";
      if ! nsenter -t 1 -m -u -n -i test -f "$$KEY_FILE"; then
        echo "ERROR: No auth key found at $$KEY_FILE on host";
        echo "Checking if directory exists on host...";
        nsenter -t 1 -m -u -n -i ls -la /mnt/sdcard/tailscale/key/ || echo "Directory not found";
        exit 1;
      fi;
      
      AUTH_KEY=$$(nsenter -t 1 -m -u -n -i cat "$$KEY_FILE" | tr -d "\n" | tr -d "\r");
      echo "Loaded auth key from host";
      
      echo "Configuring host Tailscale...";
      nsenter -t 1 -m -u -n -i tailscale up \
        --authkey="$$AUTH_KEY" \
        --advertise-exit-node \
        --advertise-routes=192.168.68.0/24 \
        --accept-dns=false \
        --login-server=https://mail.keepdream.in:18080 \
        --reset;
      
      echo "Tailscale configured successfully on host.";
      
      # Keep container alive so it does not restart constantly
      echo "Sleeping indefinitely...";
      while true; do
        sleep 300;
      done;
      '
    restart: unless-stopped
